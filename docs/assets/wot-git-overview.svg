  <text x="53" y="220" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="12">♙  Contributors</text>
  <text x="53" y="253" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="12">♡  Repository Health</text>
  <text x="53" y="286" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="12">▤  Guide &amp; Methodology</text>
  <text x="260" y="105" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="10" letter-spacing="1.4">REPOSITORY OVERVIEW</text>
