name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API and dashboard utility tests
        run: pnpm --filter @wot-git/api test

      - name: Run offline signal benchmark
        run: pnpm --filter @wot-git/api benchmark

      - name: Build API
        run: pnpm --filter @wot-git/api build

      - name: Build web app
        run: pnpm --filter @wot-git/web build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -f Dockerfile.api -t wot-git-api:ci .

      - name: Build web image
        run: docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 -t wot-git-web:ci .
